version: '3.8'

services:
  api:
    build: .
    container_name: fraud_api_service
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app
    restart: always

  dashboard:
    build: .
    container_name: fraud_dashboard_service
    command: streamlit run src/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/predict
      - DB_PATH=/app/fraud_predictions.db
    depends_on:
      - api
    volumes:
      - sqlite_data:/app
    restart: always

volumes:
  sqlite_data:
